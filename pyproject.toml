[project]
name = "ragvid"
version = "0.3.0"
description = "Type a sentence, get a graded clip. Prompt-driven video colour grading, on your own machine."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "mrkuros" }]
keywords = ["color-grading", "colour", "video", "ffmpeg", "lut", "cube", "llm", "cdl", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",  # `ragvid serve` is the primary front end
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Video :: Non-Linear Editor",
]
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.7",
    "pillow>=10.0",
    "openai>=1.40",      # Groq speaks the OpenAI-compatible API
    "anthropic>=0.40",   # alternate provider / quality baseline
]

[project.urls]
Homepage = "https://github.com/MrKuros/ragvid"
Repository = "https://github.com/MrKuros/ragvid"
Issues = "https://github.com/MrKuros/ragvid/issues"
Changelog = "https://github.com/MrKuros/ragvid/blob/main/CHANGELOG.md"
Documentation = "https://github.com/MrKuros/ragvid/tree/main/docs"

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Semantic masks ("make the sky moody"). Optional because it is 13 MB of wheel
# and ~64 MB installed against a ~5 MB base, and because a grade that names no
# subject never touches it. The 15 MB of weights are NOT bundled either: they
# are downloaded once, on an explicit call, by a front end that asked first --
# see ragvid/segment.py. Without this extra a semantic region raises
# SegmentUnavailable naming the exact install command, never an ImportError.
masks = ["onnxruntime>=1.17"]

[project.scripts]
ragvid = "ragvid.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# ragvid/web/index.html and ragvid/look_corpus/*.json are data, not code, and
# both are load-bearing: without the page `serve` shows a stub, without the
# corpus the direct planning path has nothing to retrieve. Hatchling ships every
# non-ignored file under the package, so they are in -- asserted, not assumed:
# `python -m zipfile -l dist/*.whl | grep web/index.html`.
packages = ["ragvid"]

[tool.hatch.build.targets.sdist]
# test_files/test.mp4 is 10.8 MB of a 11.2 MB sdist -- 96% of what a `pip
# install ragvid --no-binary` would download, for a fixture only
# scripts/build_looks.py needs. tests/test_render.py already skips when it is
# absent, so dropping it costs one skipped test and saves 10.8 MB.
exclude = ["test_files/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
