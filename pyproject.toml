[project]
name = "ragvid"
version = "0.1.0"
description = "Describe the vibe, get the grade. A conversational color grading CLI."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "mrkuros" }]
keywords = ["color-grading", "colour", "video", "ffmpeg", "lut", "llm", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.7",
    "pillow>=10.0",
    "openai>=1.40",      # Groq speaks the OpenAI-compatible API
    "anthropic>=0.40",   # alternate provider / quality baseline
]

[project.urls]
Homepage = "https://github.com/MrKuros/ragvid"
Repository = "https://github.com/MrKuros/ragvid"
Issues = "https://github.com/MrKuros/ragvid/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Semantic masks ("make the sky moody"). Optional because it is 13 MB of wheel
# and ~64 MB installed against a ~5 MB base, and because a grade that names no
# subject never touches it. The 15 MB of weights are NOT bundled either: they
# are downloaded once, on an explicit call, by a front end that asked first --
# see ragvid/segment.py. Without this extra a semantic region raises
# SegmentUnavailable naming the exact install command, never an ImportError.
masks = ["onnxruntime>=1.17"]

[project.scripts]
ragvid = "ragvid.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ragvid"]

[tool.pytest.ini_options]
testpaths = ["tests"]
