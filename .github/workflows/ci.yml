name: tests

on:
  push:
    branches: [main]
  pull_request:

# No API key secret is referenced anywhere on purpose: the suite must never
# reach a live LLM. If a test starts needing one, mock it instead.
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - run: uv run --extra dev pytest -q
