<title>ragvid</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* One dark surround, deliberately: you cannot judge colour against a bright
     page. Everything here is subordinate to the frame. */
  :root {
    --bg:#141416; --panel:#1c1c20; --line:#2e2e35; --ink:#ececed;
    --dim:#9a9aa4; --accent:#5ec8d8; --warm:#e0a458; --bad:#e0645a;
    --r:8px;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); height:100vh;
         display:flex; flex-direction:column; overflow:hidden; }
  button, input, select { font:inherit; color:inherit; }
  button { cursor:pointer; border-radius:var(--r); border:1px solid var(--line);
           background:var(--panel); padding:9px 15px; }
  button:hover:not(:disabled) { border-color:var(--accent); }
  button:disabled { opacity:.35; cursor:not-allowed; }
  button.primary { background:var(--accent); color:#0b1416; border-color:var(--accent);
                   font-weight:600; }
  button.primary:hover:not(:disabled) { filter:brightness(1.1); }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }

  /* ---- chrome ---- */
  header { display:flex; align-items:center; gap:14px; padding:12px 18px;
           border-bottom:1px solid var(--line); flex:none; }
  .logo { font-weight:600; letter-spacing:-.01em; }
  .clipname { color:var(--dim); font-size:14px; overflow:hidden;
              text-overflow:ellipsis; white-space:nowrap; }
  .spacer { margin-left:auto; }

  /* ---- empty state ---- */
  #empty { flex:1; display:flex; flex-direction:column; align-items:center;
           justify-content:center; gap:18px; padding:40px; text-align:center; }
  #empty h1 { font-size:26px; margin:0; font-weight:600; }
  #empty p { color:var(--dim); margin:0; max-width:46ch; line-height:1.6; }
  #empty.drag { background:#1b2427; }

  /* ---- work area ---- */
  #work { flex:1; display:flex; flex-direction:column; min-height:0; }
  .stage { flex:1; min-height:0; display:flex; align-items:center;
           justify-content:center; padding:16px 18px 8px; position:relative; }
  .frame { position:relative; max-width:100%; max-height:100%;
           border-radius:var(--r); overflow:hidden; background:#000;
           border:1px solid var(--line); }
  .frame img { display:block; max-width:100%; max-height:100%;
               width:auto; height:auto; }
  .frame img.under { position:absolute; inset:0; width:100%; height:100%; opacity:0; }
  .frame.compare img.under { opacity:1; }
  .hint { position:absolute; left:10px; bottom:10px; background:#000a;
          padding:4px 9px; border-radius:5px; font-size:11.5px; color:var(--ink);
          letter-spacing:.03em; pointer-events:none; }
  .frame.compare .hint { background:var(--warm); color:#1a1408; }
  .stage .placeholder { color:var(--dim); }

  /* ---- controls ---- */
  .controls { flex:none; padding:4px 18px 16px; display:flex;
              flex-direction:column; gap:12px; }
  .bar { display:flex; align-items:center; gap:12px; }
  input[type=range] { flex:1; accent-color:var(--accent); }
  .time { font-variant-numeric:tabular-nums; color:var(--dim);
          font-size:13px; min-width:80px; text-align:right; }

  .ask { display:flex; gap:8px; align-items:center; background:var(--panel);
         border:1px solid var(--line); border-radius:var(--r); padding:6px 6px 6px 14px; }
  .ask:focus-within { border-color:var(--accent); }
  .ask input[type=text] { flex:1; background:none; border:0; outline:none;
                          padding:8px 0; font-size:15px; min-width:0; }
  .ask input::placeholder { color:var(--dim); }
  .iconbtn { padding:8px 11px; display:flex; align-items:center; gap:7px;
             font-size:13px; color:var(--dim); }
  .iconbtn:hover:not(:disabled) { color:var(--ink); }
  .iconbtn svg { width:16px; height:16px; }

  .said { color:var(--dim); font-size:14px; line-height:1.5; min-height:1.2em;
          padding:0 2px; }
  .said b { color:var(--ink); font-weight:500; }

  .row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }

  /* ---- manual ---- */
  details.manual { border-top:1px solid var(--line); padding-top:10px; }
  details.manual summary { cursor:pointer; color:var(--dim); font-size:13.5px;
                           list-style:none; user-select:none; }
  details.manual summary::-webkit-details-marker { display:none; }
  details.manual summary::before { content:"▸ "; }
  details.manual[open] summary::before { content:"▾ "; }
  .sliders { display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
             gap:8px 26px; padding:12px 2px 4px; }
  .slider { display:grid; grid-template-columns:88px 1fr 46px; align-items:center;
            gap:10px; font-size:13px; }
  .slider span:first-child { color:var(--dim); }
  .slider output { font-variant-numeric:tabular-nums; text-align:right; color:var(--dim); }

  /* ---- banner ---- */
  #banner { display:none; margin:0 18px; padding:11px 14px; border-radius:var(--r);
            background:#2a1c1c; border:1px solid #4a2a28; color:#f3d9d6;
            font-size:14px; line-height:1.5; }
  #banner.show { display:flex; gap:12px; align-items:flex-start; }
  #banner .x { margin-left:auto; background:none; border:0; color:inherit;
               padding:0 4px; opacity:.7; }

  /* ---- modal ---- */
  dialog { border:1px solid var(--line); border-radius:12px; background:var(--panel);
           color:var(--ink); padding:0; width:min(680px,92vw); max-height:78vh; }
  dialog::backdrop { background:#000a; }
  .dhead { padding:14px 18px; border-bottom:1px solid var(--line);
           display:flex; gap:10px; align-items:center; }
  .crumbs { display:flex; gap:2px; flex-wrap:wrap; font-size:13px; overflow:hidden; }
  .crumbs button { background:none; border:0; padding:3px 5px; color:var(--dim);
                   border-radius:4px; }
  .crumbs button:hover { color:var(--ink); background:#2a2a31; }
  .crumbs button:last-child { color:var(--ink); }
  .dlist { overflow:auto; max-height:52vh; padding:6px; }
  .entry { display:flex; gap:11px; align-items:center; width:100%; text-align:left;
           background:none; border:0; padding:9px 11px; border-radius:6px; }
  .entry:hover { background:#2a2a31; }
  .entry .nm { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .entry .sz { color:var(--dim); font-size:12px; font-variant-numeric:tabular-nums; }
  .entry .ic { width:17px; text-align:center; color:var(--dim); flex:none; }
  .dfoot { padding:12px 18px; border-top:1px solid var(--line); display:flex;
           gap:8px; align-items:center; }
  .dfoot input { flex:1; background:var(--bg); border:1px solid var(--line);
                 border-radius:6px; padding:8px 11px; outline:none; }
  .empty-dir { color:var(--dim); padding:22px; text-align:center; font-size:14px; }

  /* ---- export ---- */
  .prog { flex:1; height:6px; background:var(--line); border-radius:3px; overflow:hidden; }
  .prog i { display:block; height:100%; width:0; background:var(--accent);
            transition:width .2s linear; }
  .busy { color:var(--accent); font-size:13.5px; }

  @media (prefers-reduced-motion:reduce) { * { transition:none !important; } }
</style>

<header>
  <span class="logo">ragvid</span>
  <span class="clipname" id="clipname"></span>
  <span class="spacer"></span>
  <button id="openBtn">Open clip…</button>
</header>

<div id="banner"><span id="bannerMsg"></span><button class="x" id="bannerX">✕</button></div>

<section id="empty">
  <h1>Drop a video here</h1>
  <p>Or <a href="#" id="emptyBrowse" style="color:var(--accent)">browse your files</a>.
     Then describe the look you want, check a frame, and save.</p>
</section>

<section id="work" hidden>
  <div class="stage">
    <div class="frame" id="frame" tabindex="0"
         aria-label="Preview frame. Press and hold to see the original.">
      <img id="imgGraded" alt="graded frame">
      <img id="imgSource" class="under" alt="original frame">
      <span class="hint" id="hint">hold to see original</span>
    </div>
  </div>

  <div class="controls">
    <div class="bar">
      <input type="range" id="scrub" min="0" max="100" value="0" step="0.1"
             aria-label="Position in the clip">
      <span class="time" id="time">0:00</span>
    </div>

    <form class="ask" id="askForm">
      <input type="text" id="ask" autocomplete="off"
             placeholder="Describe the look you want — e.g. warm and nostalgic">
      <button type="button" class="iconbtn" id="photoBtn" title="Match a photo instead (works offline)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10" r="1.6"/>
          <path d="M21 16l-5-5-9 8"/></svg>
        Use a photo
      </button>
      <button type="submit" class="primary" id="goBtn">Go</button>
    </form>

    <p class="said" id="said"></p>

    <div class="row">
      <button id="undoBtn" disabled>Undo</button>
      <button id="resetBtn" disabled>Start over</button>
      <span class="spacer"></span>
      <span class="row">
        <button id="exportBtn" class="primary" disabled>Save video…</button>
        <span id="exportProg" class="row" hidden style="min-width:230px">
          <span class="busy" id="exLabel">Saving…</span>
          <span class="prog"><i id="exBar"></i></span>
        </span>
      </span>
    </div>

    <details class="manual" id="manual">
      <summary>Adjust manually</summary>
      <div class="sliders" id="sliders"></div>
    </details>
  </div>
</section>

<dialog id="browser">
  <div class="dhead"><div class="crumbs" id="crumbs"></div></div>
  <div class="dlist" id="dlist"></div>
  <div class="dfoot">
    <input type="text" id="pathInput" placeholder="…or paste a path">
    <button id="pathGo">Open</button>
    <button id="browseClose">Cancel</button>
  </div>
</dialog>

<input type="file" id="videoFile" hidden
       accept="video/*,.mp4,.mov,.mkv,.webm,.avi,.m4v,.gif,.mpg,.mpeg,.wmv,.m2ts">
<input type="file" id="photoFile" hidden accept="image/*">

<script>
"use strict";
const $ = (id) => document.getElementById(id);
let S = { open: false };            // last state from the server
let t = 0;                          // scrubber position, seconds
let busy = false;
let browseMode = "video";           // what the file browser is picking

// ---- plumbing -------------------------------------------------------------

async function call(path, opts = {}) {
  const res = await fetch(path, opts);
  const ct = res.headers.get("content-type") || "";
  const body = ct.includes("json") ? await res.json() : null;
  if (!res.ok) throw Object.assign(new Error("request failed"), { info: body && body.error });
  return body;
}

// Every mutating call returns the new full state, so one request = one render.
async function post(path, payload) {
  setBusy(true);
  try {
    const opts = { method: "POST" };
    if (payload instanceof FormData) opts.body = payload;
    else if (payload) { opts.headers = { "Content-Type": "application/json" };
                        opts.body = JSON.stringify(payload); }
    render(await call(path, opts));
    hideBanner();
  } catch (e) { showError(e); }
  finally { setBusy(false); }
}

function setBusy(on, label) {
  busy = on;
  $("goBtn").textContent = on && label ? label : (S.planned ? "Apply" : "Go");
  syncEnabled();
}

// ---- errors: branch on type, never parse the message -----------------------

function showError(e) {
  const info = e.info || { type: "Error", message: e.message || "Something went wrong." };
  let msg = info.message;
  if (info.type === "ProviderNotConfigured") {
    msg = `No API key set (${info.env_var}). You can still match a photo — that works offline.`;
  } else if (info.type === "RateLimited") {
    countdown(Math.ceil(info.retry_after || 30));
    return;
  } else if (info.type === "InputError") {
    msg = `${info.message}. Try another file.`;
  }
  $("bannerMsg").textContent = msg;
  $("banner").classList.add("show");
}
function countdown(secs) {
  const tick = () => {
    if (secs <= 0) return hideBanner();
    $("bannerMsg").textContent = `Too many requests just now — try again in ${secs}s. Matching a photo still works.`;
    $("banner").classList.add("show");
    secs--; setTimeout(tick, 1000);
  };
  tick();
}
function hideBanner() { $("banner").classList.remove("show"); }
$("bannerX").onclick = hideBanner;

// ---- rendering ------------------------------------------------------------

const fmt = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;

function render(state) {
  S = state;
  $("empty").hidden = S.open;
  $("work").hidden = !S.open;
  $("clipname").textContent = S.open ? S.name : "";
  if (!S.open) return;

  $("scrub").max = Math.max(0.1, S.duration || 0.1);
  if (t > S.duration) t = 0;
  $("scrub").value = t;
  $("time").textContent = `${fmt(t)} / ${fmt(S.duration || 0)}`;

  $("ask").placeholder = S.planned
    ? "What should change? — e.g. warmer, less contrast"
    : "Describe the look you want — e.g. warm and nostalgic";
  $("said").innerHTML = S.planned && S.spec && S.spec.rationale
    ? `<b>Applied:</b> ${escapeHtml(S.spec.rationale)}` : "";

  buildSliders();
  syncEnabled();
  loadFrames();
}

function syncEnabled() {
  const on = S.open && !busy;
  $("undoBtn").disabled = !on || !S.can_undo;
  $("resetBtn").disabled = !on || !S.planned;
  $("exportBtn").disabled = !on || !S.planned;
  $("goBtn").disabled = !on;
  $("photoBtn").disabled = !on;
  $("scrub").disabled = !S.open;
  $("hint").textContent = S.planned ? "hold to see original" : "no look applied yet";
}

function escapeHtml(s) {
  return s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

// The version cache-buster is load-bearing: without it the browser happily
// shows a stale frame after a change and the tool looks broken.
function frameUrl(graded) {
  return `/media/frame?t=${t.toFixed(3)}&graded=${graded ? 1 : 0}&v=${S.version}`;
}
function loadFrames() {
  $("imgGraded").src = frameUrl(S.planned);   // nothing planned -> show the source
  $("imgSource").src = frameUrl(false);       // preloaded so compare is instant
}

// ---- scrubbing ------------------------------------------------------------

let scrubTimer = null;
$("scrub").addEventListener("input", (e) => {
  t = parseFloat(e.target.value);
  $("time").textContent = `${fmt(t)} / ${fmt(S.duration || 0)}`;
  clearTimeout(scrubTimer);
  scrubTimer = setTimeout(loadFrames, 120);   // a fast drag must not queue 20 renders
});

// ---- hold to compare ------------------------------------------------------

const hold = (on) => { if (S.planned) $("frame").classList.toggle("compare", on); };
["mousedown", "touchstart"].forEach((ev) =>
  $("frame").addEventListener(ev, (e) => { e.preventDefault(); hold(true); }, { passive: false }));
["mouseup", "mouseleave", "touchend", "touchcancel"].forEach((ev) =>
  $("frame").addEventListener(ev, () => hold(false)));

addEventListener("keydown", (e) => {
  const typing = /^(INPUT|TEXTAREA)$/.test(e.target.tagName);
  if (e.key === " " && !typing && S.open) { e.preventDefault(); hold(true); }
  if (e.key === "Escape") hideBanner();
  if ((e.ctrlKey || e.metaKey) && e.key === "z" && !typing && S.can_undo) {
    e.preventDefault(); post("/api/undo");
  }
});
addEventListener("keyup", (e) => { if (e.key === " ") hold(false); });

// ---- the one input --------------------------------------------------------

$("askForm").addEventListener("submit", (e) => {
  e.preventDefault();
  const text = $("ask").value.trim();
  if (!text || busy) return;
  setBusy(true, S.planned ? "Adjusting…" : "Thinking…");
  const done = () => { $("ask").value = ""; };
  (S.planned ? post("/api/refine", { instruction: text })
             : post("/api/vibe", { vibe: text })).then(done);
});

// A photo can be used at ANY point -- to set the look, or to pull an existing
// one towards a different reference partway through refining.
$("photoBtn").onclick = () => { browseMode = "image"; $("photoFile").click(); };
$("photoFile").onchange = (e) => {
  const f = e.target.files[0]; if (!f) return;
  const fd = new FormData(); fd.append("file", f);
  post("/api/reference", fd); e.target.value = "";
};

$("undoBtn").onclick = () => post("/api/undo");
$("resetBtn").onclick = () => {
  if (confirm("Remove the look and go back to the original clip?")) post("/api/reset");
};

// ---- opening a clip -------------------------------------------------------

$("openBtn").onclick = () => openBrowser("video");
$("emptyBrowse").onclick = (e) => { e.preventDefault(); openBrowser("video"); };
$("videoFile").onchange = (e) => {
  const f = e.target.files[0]; if (!f) return;
  const fd = new FormData(); fd.append("file", f);
  post("/api/project", fd); e.target.value = "";
};

// Drag a clip anywhere onto the window.
["dragover", "dragenter"].forEach((ev) => addEventListener(ev, (e) => {
  e.preventDefault(); if (!S.open) $("empty").classList.add("drag");
}));
["dragleave", "drop"].forEach((ev) => addEventListener(ev, () => $("empty").classList.remove("drag")));
addEventListener("drop", (e) => {
  e.preventDefault();
  const f = e.dataTransfer.files[0]; if (!f) return;
  const fd = new FormData(); fd.append("file", f);
  post(f.type.startsWith("image/") && S.open ? "/api/reference" : "/api/project", fd);
});

// ---- file browser ---------------------------------------------------------

async function openBrowser(mode, path) {
  browseMode = mode;
  $("browser").showModal();
  await listDir(path);
}
async function listDir(path) {
  try {
    const d = await call("/api/browse" + (path ? `?path=${encodeURIComponent(path)}` : ""));
    $("pathInput").value = d.path;
    $("crumbs").innerHTML = "";
    d.trail.slice(-6).forEach((c) => {
      const b = document.createElement("button");
      b.textContent = c.name || "/"; b.onclick = () => listDir(c.path);
      $("crumbs").append(b);
    });
    const list = $("dlist"); list.innerHTML = "";
    const want = browseMode === "image" ? "image" : "video";
    const files = d.files.filter((f) => f.kind === want);
    d.dirs.forEach((x) => list.append(entry("📁", x.name, "", () => listDir(x.path))));
    files.forEach((f) => list.append(entry(
      want === "image" ? "🖼" : "🎬", f.name, kb(f.size), () => choose(f.path))));
    if (!d.dirs.length && !files.length) {
      const p = document.createElement("p");
      p.className = "empty-dir";
      p.textContent = `No ${want}s in this folder.`;
      list.append(p);
    }
  } catch (e) { showError(e); }
}
const kb = (n) => n > 1e6 ? `${(n / 1e6).toFixed(1)} MB` : `${Math.round(n / 1e3)} KB`;
function entry(icon, name, size, onclick) {
  const b = document.createElement("button");
  b.className = "entry";
  b.innerHTML = `<span class="ic">${icon}</span><span class="nm"></span><span class="sz"></span>`;
  b.querySelector(".nm").textContent = name;
  b.querySelector(".sz").textContent = size;
  b.onclick = onclick;
  return b;
}
function choose(path) {
  $("browser").close();
  post(browseMode === "image" ? "/api/reference" : "/api/project", { path });
}
$("pathGo").onclick = () => {
  const v = $("pathInput").value.trim();
  if (v) choose(v);
};
$("pathInput").addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); $("pathGo").click(); } });
$("browseClose").onclick = () => $("browser").close();

// ---- manual sliders -------------------------------------------------------
// Plain names. Nobody outside a grading suite says "saturation slope offset".
const KNOBS = [
  ["saturation", "Colour",   0, 2,    0.01],
  ["temperature", "Warmth", -3000, 3000, 50],
  ["tint",       "Tint",    -1, 1,    0.01],
  ["contrast",   "Contrast", -1, 1,   0.01],
];
let slidersFor = null;
function buildSliders() {
  if (!S.planned) { $("sliders").innerHTML = "<p class='empty-dir'>Apply a look first.</p>"; return; }
  if (slidersFor === S.version) return;         // don't rebuild mid-drag
  slidersFor = S.version;
  $("sliders").innerHTML = "";
  KNOBS.forEach(([key, label, min, max, step]) => {
    const row = document.createElement("label");
    row.className = "slider";
    row.innerHTML = `<span>${label}</span>
      <input type="range" min="${min}" max="${max}" step="${step}" value="${S.spec[key]}">
      <output>${fmtNum(S.spec[key])}</output>`;
    const [, input, out] = row.children;
    input.addEventListener("input", () => { out.textContent = fmtNum(input.value); });
    // commit on release, not on every pixel of the drag
    input.addEventListener("change", () => {
      const spec = { ...S.spec, [key]: parseFloat(input.value) };
      slidersFor = null;
      post("/api/spec", { spec });
    });
    $("sliders").append(row);
  });
}
const fmtNum = (v) => Math.abs(v) >= 100 ? Math.round(v) : (+v).toFixed(2);

// ---- export ---------------------------------------------------------------

// The button and the progress readout are both permanent; only their
// visibility swaps. Rebuilding the button's DOM would drop its handler.
$("exportBtn").onclick = async () => {
  const dir = (S.source || "").replace(/[/\\][^/\\]*$/, "");
  const name = (S.name || "clip").replace(/\.[^.]+$/, "") + "-graded.mp4";
  const out = prompt("Save the graded video as:", dir ? `${dir}/${name}` : name);
  if (!out) return;
  try {
    const { job } = await call("/api/export", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ out, gpu: false }),
    });
    watchExport(job, out);
  } catch (e) { showError(e); }
};

function showExporting(on) {
  $("exportBtn").hidden = on;
  $("exportProg").hidden = !on;
}

function watchExport(job, out) {
  showExporting(true);
  const poll = async () => {
    try {
      const j = await call(`/api/export/${job}`);
      const pct = Math.round(j.progress * 100);
      $("exBar").style.width = `${pct}%`;
      if (j.state === "running") {
        $("exLabel").textContent = `Saving… ${pct}%`;
        return setTimeout(poll, 300);
      }
      if (j.state === "error") { showError({ info: j.error }); showExporting(false); return; }
      $("exLabel").textContent = `Saved to ${out}`;
      $("exBar").style.width = "100%";
      setTimeout(() => showExporting(false), 6000);
    } catch (e) { showError(e); showExporting(false); }
  };
  poll();
}

// ---- go -------------------------------------------------------------------
call("/api/state").then(render).catch(showError);
</script>
